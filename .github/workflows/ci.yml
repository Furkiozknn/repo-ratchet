name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # olculen en uzun kosu 31 sn
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # The signals that read git history need a real git identity on the
      # runner, because the suite builds real repositories to measure.
      - name: git identity for the fixture repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      # Not `-q`. Under it pytest printed the progress dots and stopped:
      # the run log carried no "N passed" line at all. The profile page
      # publishes this repository's test count and names `130 passed` as the
      # line it came from - a line this workflow never wrote. The count was
      # right and its source was not there, so nothing could re-read it, and
      # the offline consistency check stayed green because four copies of one
      # unverifiable number still agree with each other.
      - run: python -m pytest

  self:
    name: the engine on itself
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 10 sn
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # release_lag counts commits since the last tag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install it the way the README tells a new user to, so a broken
      # package (a missing module, a wrong entry point) fails here and not on
      # somebody's first run. Everything below uses the installed `ratchet`.
      - name: Install the package
        run: |
          python -m pip install .
          ratchet --version
      - name: Survey this repository with its own surveyor
        run: ratchet survey --path .
      - name: The committed state still produces a queue
        run: ratchet queue --json > /dev/null
      # If the fence ever stops refusing these, the check runner has
      # regressed in the one way that matters. The second one is the same
      # command asked of an allowed shell.
      - name: The fence still refuses what it should
        run: |
          set -eu
          for cmd in "rm -rf /" 'bash -c "rm -rf /"'; do
            if ratchet check . --command "$cmd"; then
              echo "the fence let this through: $cmd" >&2
              exit 1
            fi
            echo "refused, as it should be: $cmd"
          done
